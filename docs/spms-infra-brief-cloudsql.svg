<svg viewBox="0 0 880 300" width="880" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="880" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b232c"/>
    </marker>
  </defs>
  <text x="220" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1b232c">VPC Peering — draft plan</text>
  <text x="660" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1b232c">Private Service Connect — admin's suggestion</text>
  <line x1="440" y1="42" x2="440" y2="280" stroke="#1b232c" stroke-opacity=".15"/>

  <!-- LEFT: peering -->
  <rect x="40" y="120" width="130" height="56" rx="8" fill="none" stroke="#1b232c" stroke-width="1.4"/>
  <text x="105" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1b232c">Cloud Run</text>
  <text x="105" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1b232c" opacity=".65">(our subnet)</text>

  <rect x="170" y="132" width="110" height="32" fill="#dceef1" stroke="#1e7a8c" stroke-width="1.4"/>
  <text x="225" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#145a68">VPC peering</text>
  <text x="225" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1b232c" opacity=".65">reserved /20 range</text>

  <rect x="280" y="105" width="150" height="86" rx="8" fill="none" stroke="#1b232c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="355" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1b232c" opacity=".65">Google-managed producer VPC</text>
  <rect x="295" y="130" width="120" height="40" rx="6" fill="none" stroke="#1b232c" stroke-width="1.4"/>
  <text x="355" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1b232c">Cloud SQL</text>

  <line x1="170" y1="148" x2="280" y2="148" stroke="#1b232c" stroke-width="1.4" marker-end="url(#a1)"/>

  <!-- RIGHT: PSC -->
  <rect x="480" y="120" width="130" height="56" rx="8" fill="none" stroke="#1b232c" stroke-width="1.4"/>
  <text x="545" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1b232c">Cloud Run</text>
  <text x="545" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1b232c" opacity=".65">(our subnet)</text>

  <circle cx="670" cy="148" r="7" fill="#1e7a8c"/>
  <text x="670" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#145a68">PSC endpoint</text>
  <text x="670" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1b232c" opacity=".65">1 internal IP</text>

  <rect x="730" y="120" width="120" height="56" rx="8" fill="none" stroke="#1b232c" stroke-width="1.4"/>
  <text x="790" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1b232c">Cloud SQL</text>
  <text x="790" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1b232c" opacity=".65">service attach.</text>

  <line x1="610" y1="148" x2="663" y2="148" stroke="#1b232c" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="677" y1="148" x2="730" y2="148" stroke="#1b232c" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="700" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1b232c" opacity=".65">forwarding rule</text>

  <text x="105" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1b232c" opacity=".65">peering = whole networks</text>
  <text x="670" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1b232c" opacity=".65">PSC = one endpoint object</text>
</svg>
