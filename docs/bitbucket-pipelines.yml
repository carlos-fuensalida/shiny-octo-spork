# CI/CD for SPMS Frontend — Next.js (standalone) on Google Cloud Run.
#
# Scope: three triggers.
#   - Any pull request runs lint/typecheck/test only (no Docker, no GCP, no
#     deploy) as a pre-merge gate on the feature branch itself.
#   - A push that lands on dev, qa, or main runs the full sequence: resolve
#     that branch's environment variables, lint/typecheck/test, build the
#     Next.js app directly (no Docker), package that build into a Docker
#     image and push it to Artifact Registry, then deploy it to Cloud Run
#     (service name derived from BITBUCKET_REPO_SLUG). Feature branches are
#     merged into dev — never pushed to it directly (CLAUDE.md → Branching)
#     — and that merge is what triggers the dev deploy; qa and main deploy
#     the same way once code is promoted onto those branches.
#
# Auth to GCP is Workload Identity Federation via the step's OIDC token — no
# long-lived service account keys anywhere. The same GCP service account is
# used both to authenticate the pipeline (the OIDC exchange) and as the
# Cloud Run service's own runtime identity (--service-account on `gcloud run
# deploy`) — there is no separate deploy-time vs. runtime service account,
# matching bitbucket-pipelines-frontend.yml.
#
# WHY THE BUILD HAPPENS OUTSIDE DOCKER (added 2026-08-11): `next build` used
# to run inside the "Build & Push Docker Image" step's `docker build`, via
# the Docker-in-Docker sidecar (`services: [docker]`). That nested-build
# context is a known trap for Next.js's Turbopack — it tends to over-detect
# available CPU and thrash instead of just running slower — and it did here:
# the identical `npm run build` that takes seconds in the plain
# node:22-alpine step below took over two hours inside `docker build` and
# got killed by Bitbucket's 120-minute step limit. Fix: build once in "Build
# Next.js App" (plain container, no Docker-in-Docker), pass the build output
# to the next step as pipeline artifacts, and have the Docker step only
# package it — see the Dockerfile's own header comment for the runner side
# of this.
#
# SPM-187/188 — Google IAP now authenticates every user in front of this
# service, and both backends are private, so NEXT_PUBLIC_API_BASE_URL /
# NEXT_PUBLIC_CHAT_API_BASE_URL are gone: the browser never calls a backend
# URL directly anymore, only this app's own same-origin BFF routes. Nothing
# is baked into the browser bundle at `next build` time anymore, so the
# build step needs no backend URLs at all — they're all runtime-only
# `--set-env-vars` on the deploy step instead.
#
# The Cloud Run service is never publicly reachable: `gcloud run deploy`
# always passes --no-allow-unauthenticated, on top of Google IAP sitting in
# front of it. There is no allow-unauthenticated override for any branch.
#
# ENVIRONMENT RESOLUTION
# ----------------------
# The "Get Environment Variables" step maps $BITBUCKET_BRANCH (dev/qa/main)
# to a set of generic ENVIRONMENT_* values, each sourced from a
# per-environment prefixed variable (DEV_/QA_/PROD_). Every later step reads
# only the generic ENVIRONMENT_* name — this is what lets the same four step
# definitions run unchanged across all three branches, the same pattern
# bitbucket-pipelines-frontend.yml uses.
#
# Required Bitbucket repository variables — add these (this pipeline reads
# them but does not define them). {PREFIX} is DEV, QA, or PROD to match the
# branch:
#
#   {PREFIX}_WORKLOAD_IDENTITY_PROVIDER_ID          — WIF provider for the
#                                                      OIDC auth exchange
#   {PREFIX}_ENVIRONMENT_GCP_SERVICE_ACCOUNT        — SA impersonated for
#                                                      that OIDC exchange AND
#                                                      used as the Cloud Run
#                                                      runtime identity
#   {PREFIX}_ENVIRONMENT_GCP_PROJECT_ID
#   {PREFIX}_ENVIRONMENT_GCP_REGION
#   {PREFIX}_ENVIRONMENT_ARTIFACT_REGISTRY
#   {PREFIX}_ENVIRONMENT_IAP_AUDIENCE               — Cloud Run v2 IAP
#                                                      resource name, e.g.
#                                                      /projects/<project_number>/locations/<region>/services/<service>
#                                                      (Console → Security →
#                                                      Identity-Aware Proxy →
#                                                      this resource →
#                                                      signed header JWT
#                                                      audience). If unset,
#                                                      src/lib/iap.ts's
#                                                      verifyIapAssertion()
#                                                      bails out before even
#                                                      inspecting the
#                                                      assertion, and every
#                                                      request gets a bare
#                                                      401.
#   {PREFIX}_ENVIRONMENT_INTERNAL_API_BASE_URL      — Backend A's private
#                                                      Cloud Run URL for this
#                                                      environment (its
#                                                      status.url, the
#                                                      hash-based alias — it
#                                                      must match exactly for
#                                                      ServiceIdentityGuard's
#                                                      audience check)
#   {PREFIX}_ENVIRONMENT_INTERNAL_CHAT_API_BASE_URL — Backend B's private
#                                                      Cloud Run URL for this
#                                                      environment
#
# DEV_WORKLOAD_IDENTITY_PROVIDER_ID, DEV_ENVIRONMENT_GCP_SERVICE_ACCOUNT,
# DEV_ENVIRONMENT_GCP_PROJECT_ID, DEV_ENVIRONMENT_GCP_REGION and
# DEV_ENVIRONMENT_ARTIFACT_REGISTRY already exist at the workspace level
# (inherited from the backend pipeline) — nothing to add for those five.
# Every other variable above — the three DEV_ENVIRONMENT_IAP_AUDIENCE /
# INTERNAL_API_BASE_URL / INTERNAL_CHAT_API_BASE_URL variables, and the full
# QA_*/PROD_* set — does not exist yet and must be added before the
# corresponding branch pipeline will run. qa and main additionally need
# their own GCP projects to exist first.
#
# SELF_BASE_URL (this app's own URL, needed for server-side self-fetches of
# its own BFF proxy routes) is not part of the list above — it can't be
# known until Cloud Run assigns this service its URL, so the deploy step
# deploys once with a placeholder, then patches it in via `gcloud run
# services update --update-env-vars` once the real URL is known — see that
# step's own comment.

image: google/cloud-sdk:latest

# `docker: true` deliberately NOT set here as a global option — see the
# "WHY THE BUILD HAPPENS OUTSIDE DOCKER" header comment above. As a global
# option it attaches a Docker sidecar to EVERY step, lint_typecheck_test and
# build_app included, which reproduces the exact nested-daemon hang that
# comment describes even though neither of those steps calls `docker` at
# all. Only build_and_push_image declares `services: [docker]` for itself,
# since it's the only step that actually builds an image.
options:
  size: 2x

definitions:
  caches:
    npm: ~/.npm

  steps:
    - step: &get_env_variable
        name: Get Environment Variables
        script:
          - echo "Getting Environment Variables..."
          - |
            if [[ "$BITBUCKET_BRANCH" == "dev" ]]; then
              echo ENVIRONMENT_WORKLOAD_IDENTITY_PROVIDER_ID=$DEV_WORKLOAD_IDENTITY_PROVIDER_ID >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_GCP_SERVICE_ACCOUNT=$DEV_ENVIRONMENT_GCP_SERVICE_ACCOUNT >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_GCP_PROJECT_ID=$DEV_ENVIRONMENT_GCP_PROJECT_ID >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_GCP_REGION=$DEV_ENVIRONMENT_GCP_REGION >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_ARTIFACT_REGISTRY=$DEV_ENVIRONMENT_ARTIFACT_REGISTRY >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_IAP_AUDIENCE=$DEV_ENVIRONMENT_IAP_AUDIENCE >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_INTERNAL_API_BASE_URL=$DEV_ENVIRONMENT_INTERNAL_API_BASE_URL >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_INTERNAL_CHAT_API_BASE_URL=$DEV_AI_BACKEND_URL >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT=dev >> $BITBUCKET_PIPELINES_VARIABLES_PATH
            elif [[ "$BITBUCKET_BRANCH" == "qa" ]]; then
              echo ENVIRONMENT_WORKLOAD_IDENTITY_PROVIDER_ID=$QA_WORKLOAD_IDENTITY_PROVIDER_ID >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_GCP_SERVICE_ACCOUNT=$QA_ENVIRONMENT_GCP_SERVICE_ACCOUNT >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_GCP_PROJECT_ID=$QA_ENVIRONMENT_GCP_PROJECT_ID >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_GCP_REGION=$QA_ENVIRONMENT_GCP_REGION >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_ARTIFACT_REGISTRY=$QA_ENVIRONMENT_ARTIFACT_REGISTRY >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_IAP_AUDIENCE=$QA_ENVIRONMENT_IAP_AUDIENCE >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_INTERNAL_API_BASE_URL=$QA_ENVIRONMENT_INTERNAL_API_BASE_URL >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_INTERNAL_CHAT_API_BASE_URL=$QA_AI_BACKEND_URL >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT=qa >> $BITBUCKET_PIPELINES_VARIABLES_PATH
            elif [[ "$BITBUCKET_BRANCH" == "main" ]]; then
              echo ENVIRONMENT_WORKLOAD_IDENTITY_PROVIDER_ID=$PROD_WORKLOAD_IDENTITY_PROVIDER_ID >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_GCP_SERVICE_ACCOUNT=$PROD_ENVIRONMENT_GCP_SERVICE_ACCOUNT >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_GCP_PROJECT_ID=$PROD_ENVIRONMENT_GCP_PROJECT_ID >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_GCP_REGION=$PROD_ENVIRONMENT_GCP_REGION >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_ARTIFACT_REGISTRY=$PROD_ENVIRONMENT_ARTIFACT_REGISTRY >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_IAP_AUDIENCE=$PROD_ENVIRONMENT_IAP_AUDIENCE >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_INTERNAL_API_BASE_URL=$PROD_ENVIRONMENT_INTERNAL_API_BASE_URL >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT_INTERNAL_CHAT_API_BASE_URL=$PROD_AI_BACKEND_URL >> $BITBUCKET_PIPELINES_VARIABLES_PATH
              echo ENVIRONMENT=prod >> $BITBUCKET_PIPELINES_VARIABLES_PATH
            else
              echo "Branch does not match any known environments. Exiting..."
              exit 1
            fi
        output-variables:
          - ENVIRONMENT
          - ENVIRONMENT_WORKLOAD_IDENTITY_PROVIDER_ID
          - ENVIRONMENT_GCP_SERVICE_ACCOUNT
          - ENVIRONMENT_GCP_PROJECT_ID
          - ENVIRONMENT_GCP_REGION
          - ENVIRONMENT_ARTIFACT_REGISTRY
          - ENVIRONMENT_IAP_AUDIENCE
          - ENVIRONMENT_INTERNAL_API_BASE_URL
          - ENVIRONMENT_INTERNAL_CHAT_API_BASE_URL

    - step: &lint_typecheck_test
        name: Lint, Typecheck & Test
        image: node:22-alpine
        caches:
          - npm
        script:
          - set -euo pipefail
          - export HUSKY=0
          - npm ci --include=optional
          - echo "Linting..."
          - npm run lint
          - echo "Typechecking..."
          - npm run typecheck
          - echo "Running tests..."
          - npm test

    - step: &build_app
        name: Build Next.js App
        image: node:22-alpine
        caches:
          - npm
        script:
          - set -euo pipefail
          - export HUSKY=0
          - npm ci --include=optional
          # No backend URLs to resolve here anymore (SPM-188) — nothing gets
          # baked into the browser bundle; INTERNAL_API_BASE_URL,
          # INTERNAL_CHAT_API_BASE_URL, IAP_AUDIENCE, and SELF_BASE_URL are
          # all runtime-only and set on the deploy step instead.
          - echo "Building..."
          - npm run build
        artifacts:
          - .next/standalone/**
          - .next/static/**

    - step: &build_and_push_image
        name: Build & Push Docker Image
        services:
          - docker
        oidc: true
        script:
          - &gcp_auth |
            set -eo pipefail
            echo "Authenticating to GCP via Workload Identity Federation..."
            AUTH_DIR="$(mktemp -d)"
            printf '%s' "$BITBUCKET_STEP_OIDC_TOKEN" > "${AUTH_DIR}/oidc-token.txt"
            gcloud iam workload-identity-pools create-cred-config \
              "${ENVIRONMENT_WORKLOAD_IDENTITY_PROVIDER_ID}" \
              --service-account="${ENVIRONMENT_GCP_SERVICE_ACCOUNT}" \
              --output-file="${AUTH_DIR}/credentials.json" \
              --credential-source-file="${AUTH_DIR}/oidc-token.txt"
            export GOOGLE_APPLICATION_CREDENTIALS="${AUTH_DIR}/credentials.json"
            gcloud auth login --cred-file="${AUTH_DIR}/credentials.json"
            gcloud config set project "${ENVIRONMENT_GCP_PROJECT_ID}"
            gcloud auth list
          - |
            set -euo pipefail
            gcloud auth configure-docker "${ENVIRONMENT_GCP_REGION}-docker.pkg.dev" --quiet

            TAG="$(date +%Y%m%d%H%M%S)-${BITBUCKET_BUILD_NUMBER}"
            IMAGE_NAME="${BITBUCKET_REPO_SLUG}"
            IMAGE_BASE="${ENVIRONMENT_GCP_REGION}-docker.pkg.dev/${ENVIRONMENT_GCP_PROJECT_ID}/${ENVIRONMENT_ARTIFACT_REGISTRY}/${IMAGE_NAME}"
            echo "Image will be ${IMAGE_BASE}:${TAG}"

            # .next/standalone and .next/static are restored from the "Build
            # Next.js App" step's artifacts (already in this checkout) — this
            # step never runs `next build` itself, see the Dockerfile header.
            # No --build-arg for INTERNAL_API_BASE_URL/INTERNAL_CHAT_API_BASE_URL/
            # IAP_AUDIENCE/SELF_BASE_URL: they're runtime-only and set via
            # --set-env-vars on the deploy step, not baked into the image.
            # The Dockerfile's ARGs for them default to empty and only matter
            # for someone manually building/running the image outside this
            # pipeline.
            docker build --pull \
              --label "org.opencontainers.image.revision=${BITBUCKET_COMMIT}" \
              --label "org.opencontainers.image.version=${TAG}" \
              -t "${IMAGE_BASE}:${TAG}" \
              -t "${IMAGE_BASE}:latest" \
              .

            echo "Pushing Docker image..."
            docker push "${IMAGE_BASE}:${TAG}"
            docker push "${IMAGE_BASE}:latest"

            # The deploy step deploys this immutable tag, never :latest.
            echo "IMAGE_URI=${IMAGE_BASE}:${TAG}" > build_info.txt
            echo "Image pushed successfully."
        artifacts:
          - build_info.txt

    - step: &deploy_cloud_run
        name: Deploy to Cloud Run
        oidc: true
        script:
          - *gcp_auth
          - |
            set -euo pipefail

            echo "Validating environment variables..."
            if [ -z "${ENVIRONMENT_GCP_PROJECT_ID:-}" ] || [ -z "${ENVIRONMENT_GCP_REGION:-}" ] || \
               [ -z "${ENVIRONMENT_GCP_SERVICE_ACCOUNT:-}" ] || [ -z "${ENVIRONMENT_IAP_AUDIENCE:-}" ] || \
               [ -z "${ENVIRONMENT_INTERNAL_API_BASE_URL:-}" ] || [ -z "${ENVIRONMENT_INTERNAL_CHAT_API_BASE_URL:-}" ]; then
              echo "ERROR: one or more ENVIRONMENT_* variables are empty for branch '${BITBUCKET_BRANCH}'." >&2
              echo "Check that the matching {PREFIX}_* repository variable is set — see this file's header comment for the full list." >&2
              exit 1
            fi

            IMAGE_URI="$(grep '^IMAGE_URI=' build_info.txt | cut -d'=' -f2-)"
            if [[ -z "$IMAGE_URI" ]]; then
              echo "IMAGE_URI missing from build_info.txt — did the build step run?"
              exit 1
            fi

            gcloud artifacts docker images describe "${IMAGE_URI}"

            SERVICE_NAME="${BITBUCKET_REPO_SLUG}"

            echo "Deploying ${IMAGE_URI} to ${SERVICE_NAME} (${ENVIRONMENT})..."

            # SELF_BASE_URL isn't known until Cloud Run assigns this service
            # its own URL, so the first deploy ships a placeholder — nothing
            # currently calls it at request time (no Server Component calls
            # the BFF proxy server-side yet), but src/services/http.ts throws
            # a clear error if that ever changes and it's still unset, so
            # this keeps it correct regardless. The `gcloud run services
            # update` below patches in the real value.
            #
            # --no-allow-unauthenticated: this service is never called
            # directly by end users. Google IAP fronts it, and the Cloud Run
            # IAM invoker binding stays private on top of that — there is no
            # public entry point at either layer.
            #
            # --service-account uses the same SA the OIDC exchange above
            # authenticated as (ENVIRONMENT_GCP_SERVICE_ACCOUNT) — it is both
            # the deployer identity and the Cloud Run runtime identity.
            #
            # PORT is deliberately absent from --set-env-vars: Cloud Run
            # reserves it and injects it from --port; the Next standalone
            # server reads it at runtime.
            gcloud run deploy "${SERVICE_NAME}" \
              --image "${IMAGE_URI}" \
              --region "${ENVIRONMENT_GCP_REGION}" \
              --service-account="${ENVIRONMENT_GCP_SERVICE_ACCOUNT}" \
              --platform managed \
              --no-allow-unauthenticated \
              --port 8080 \
              --cpu 1 \
              --memory 512Mi \
              --concurrency 80 \
              --min-instances 0 \
              --max-instances 10 \
              --timeout 300 \
              --labels "app=spms-frontend,env=${ENVIRONMENT},commit=${BITBUCKET_COMMIT}" \
              --set-env-vars "INTERNAL_API_BASE_URL=${ENVIRONMENT_INTERNAL_API_BASE_URL},INTERNAL_CHAT_API_BASE_URL=${ENVIRONMENT_INTERNAL_CHAT_API_BASE_URL},IAP_AUDIENCE=${ENVIRONMENT_IAP_AUDIENCE},SELF_BASE_URL=https://placeholder.invalid" \
              --quiet

            SERVICE_URL="$(gcloud run services describe "${SERVICE_NAME}" \
              --region "${ENVIRONMENT_GCP_REGION}" \
              --format='value(status.url)')"
            echo "Deployed successfully! Service URL: ${SERVICE_URL}"

            echo "Setting SELF_BASE_URL to the service's own URL..."
            gcloud run services update "${SERVICE_NAME}" \
              --region "${ENVIRONMENT_GCP_REGION}" \
              --update-env-vars "SELF_BASE_URL=${SERVICE_URL}" \
              --quiet

            # No -f here (deliberately): this only logs the status code, it
            # does not gate the pipeline on it. With --no-allow-unauthenticated,
            # an unauthenticated curl is expected to be rejected (403 from
            # Cloud Run IAM, or intercepted by IAP first) — that is the
            # correct, private-by-default behaviour, not a failure.
            echo "Smoke checking ${SERVICE_URL} ..."
            curl -sS --retry 3 --retry-delay 5 \
              -o /dev/null -w 'smoke check returned HTTP %{http_code}\n' \
              "${SERVICE_URL}"

pipelines:
  # PRs into any branch only lint/typecheck/test — no Docker build, no GCP
  # auth, no deploy. This is the pre-merge gate: catch a broken build/test on
  # the feature branch itself, before it ever reaches dev. Only a push that
  # lands on dev, qa, or main runs the full build-and-deploy below.
  pull-requests:
    '**':
      - step: *lint_typecheck_test

  branches:
    dev:
      - step: *get_env_variable
      - step: *lint_typecheck_test
      - step: *build_app
      - step: *build_and_push_image
      - step: *deploy_cloud_run

    qa:
      - step: *get_env_variable
      - step: *lint_typecheck_test
      - step: *build_app
      - step: *build_and_push_image
      - step: *deploy_cloud_run

    main:
      - step: *get_env_variable
      - step: *lint_typecheck_test
      - step: *build_app
      - step: *build_and_push_image
      - step: *deploy_cloud_run
