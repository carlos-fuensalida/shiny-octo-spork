<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-label="Architecture diagram: browsers reach the frontend through Google IAP unchanged; the frontend still calls the backend and AI agent over IAM identity tokens unchanged; only the backend gains a new Direct VPC egress path through a new VPC and subnet to a private-IP-only Cloud SQL instance, while its own ingress and IAM stay as they are today.">
        <defs>
          <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#5B6B7A"/>
          </marker>
          <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#0E7C86"/>
          </marker>
        </defs>

        <rect x="0" y="0" width="1400" height="780" fill="#FFFFFF"/>

        <!-- Browser -->
        <rect x="130" y="30" width="280" height="50" rx="8" fill="#FFFFFF" stroke="#D7DEE3" stroke-width="1.5"/>
        <text x="270" y="52" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="700" font-size="14" fill="#16202B">Browser</text>
        <text x="270" y="68" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#5B6B7A">whirlpool.com + evalueserve.com accounts</text>

        <line x1="270" y1="80" x2="270" y2="116" stroke="#5B6B7A" stroke-width="1.6" marker-end="url(#arrow-muted)"/>

        <!-- IAP -->
        <rect x="160" y="118" width="220" height="46" rx="8" fill="#FFFFFF" stroke="#D7DEE3" stroke-width="1.5"/>
        <text x="270" y="138" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="700" font-size="13" fill="#16202B">Google IAP</text>
        <text x="270" y="153" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#5B6B7A">(unchanged)</text>

        <line x1="270" y1="164" x2="270" y2="226" stroke="#5B6B7A" stroke-width="1.6" marker-end="url(#arrow-muted)"/>

        <!-- Org policy chip A -->
        <rect x="420" y="112" width="320" height="60" rx="6" fill="#FBF0DD" stroke="#A6690A" stroke-width="1.3" stroke-dasharray="3,3"/>
        <text x="436" y="134" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#A6690A">Org policy: allowedPolicyMemberDomains</text>
        <text x="436" y="150" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" fill="#A6690A">blocks allUsers — unaffected by this change</text>
        <line x1="420" y1="142" x2="380" y2="142" stroke="#A6690A" stroke-width="1.2" stroke-dasharray="2,3"/>
        <circle cx="380" cy="142" r="2.6" fill="#A6690A"/>

        <!-- GCP project boundary -->
        <rect x="40" y="180" width="1140" height="480" rx="10" fill="none" stroke="#5B6B7A" stroke-width="1.5" stroke-dasharray="6,5"/>
        <text x="60" y="205" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="0.03em" fill="#5B6B7A">GCP PROJECT — prj-na-gss-supp-perform-d-219 (dev)</text>

        <!-- Frontend card -->
        <rect x="120" y="230" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#D7DEE3" stroke-width="1.5"/>
        <text x="270" y="258" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="700" font-size="13" fill="#16202B">supp-perf-mgmt-frontend</text>
        <text x="270" y="277" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#5B6B7A">Ingress: All · IAM + IAP required</text>
        <text x="270" y="310" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#5B6B7A">— unchanged —</text>

        <!-- AI card -->
        <rect x="460" y="230" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#D7DEE3" stroke-width="1.5"/>
        <text x="610" y="258" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="700" font-size="13" fill="#16202B">supp-perf-mgmt-ai</text>
        <text x="610" y="277" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#5B6B7A">Ingress: All · IAM only</text>
        <text x="610" y="310" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#5B6B7A">— unchanged —</text>

        <!-- Backend card -->
        <rect x="800" y="230" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#D7DEE3" stroke-width="1.5"/>
        <text x="950" y="254" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="700" font-size="13" fill="#16202B">supp-perf-mgmt-backend</text>
        <text x="950" y="272" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#5B6B7A">Ingress: All · IAM only — unchanged</text>
        <text x="950" y="312" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#0B5C63">+ Direct VPC egress (NEW)</text>

        <!-- frontend -> ai -->
        <line x1="420" y1="285" x2="460" y2="285" stroke="#5B6B7A" stroke-width="1.6" marker-end="url(#arrow-muted)"/>
        <text x="440" y="303" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#5B6B7A">IAM identity token (SA-to-SA) — unchanged</text>

        <!-- frontend -> backend elbow -->
        <path d="M270,340 L270,390 L950,390 L950,340" fill="none" stroke="#5B6B7A" stroke-width="1.6" marker-end="url(#arrow-muted)"/>
        <text x="610" y="383" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#5B6B7A">IAM identity token (SA-to-SA) — unchanged</text>

        <!-- backend -> public internet (unaffected) -->
        <line x1="1100" y1="285" x2="1220" y2="285" stroke="#5B6B7A" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-muted)"/>

        <!-- public internet pill -->
        <rect x="1220" y="245" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#D7DEE3" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="1295" y="270" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="700" font-size="11" fill="#16202B">Public internet</text>
        <text x="1295" y="286" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="700" font-size="11" fill="#16202B">+ Google APIs</text>
        <text x="1295" y="305" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" fill="#5B6B7A">unaffected</text>

        <!-- backend -> subnet (NEW) -->
        <line x1="950" y1="340" x2="950" y2="493" stroke="#0E7C86" stroke-width="2.6" marker-end="url(#arrow-accent)"/>
        <text x="965" y="405" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#0B5C63">Direct VPC egress</text>
        <text x="965" y="421" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#0B5C63">--vpc-egress=private-ranges-only</text>

        <!-- VPC boundary -->
        <text x="805" y="462" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" font-size="11" fill="#0B5C63">spms-vpc-dev · 10.10.0.0/16 — NEW</text>
        <rect x="800" y="470" width="300" height="160" rx="10" fill="none" stroke="#0E7C86" stroke-width="2"/>

        <!-- Subnet node -->
        <rect x="825" y="495" width="250" height="45" rx="6" fill="#E4F1EF" stroke="#0E7C86" stroke-width="1.5"/>
        <text x="840" y="513" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="700" font-size="11" fill="#16202B">spms-backend-egress-dev</text>
        <text x="840" y="528" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#5B6B7A">10.10.0.0/24</text>

        <!-- subnet -> cloud sql -->
        <line x1="950" y1="540" x2="950" y2="565" stroke="#0E7C86" stroke-width="2" marker-end="url(#arrow-accent)"/>
        <text x="965" y="556" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" fill="#0B5C63">PSA peering</text>

        <!-- Cloud SQL node -->
        <rect x="825" y="565" width="250" height="45" rx="6" fill="#E4F1EF" stroke="#0E7C86" stroke-width="1.5"/>
        <text x="840" y="583" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="700" font-size="11" fill="#16202B">supp-perf-mgmt-db-dev</text>
        <text x="840" y="598" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#5B6B7A">Postgres 15 · private IP only</text>

        <!-- Org policy chip B -->
        <rect x="440" y="515" width="320" height="72" rx="6" fill="#FBF0DD" stroke="#A6690A" stroke-width="1.3" stroke-dasharray="3,3"/>
        <text x="456" y="538" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#A6690A">Org policy: sql.restrictPublicIp</text>
        <text x="456" y="555" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" fill="#A6690A">blocked a public-IP instance outright —</text>
        <text x="456" y="570" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" fill="#A6690A">resolved by this private-IP + VPC path</text>
        <line x1="760" y1="550" x2="825" y2="587" stroke="#A6690A" stroke-width="1.2" stroke-dasharray="2,3"/>
        <circle cx="825" cy="587" r="2.6" fill="#A6690A"/>

        <!-- Legend -->
        <g>
          <line x1="80" y1="712" x2="120" y2="712" stroke="#5B6B7A" stroke-width="1.6"/>
          <text x="130" y="716" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#5B6B7A">existing, unchanged</text>

          <line x1="340" y1="712" x2="380" y2="712" stroke="#0E7C86" stroke-width="2.6"/>
          <text x="390" y="716" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#0B5C63">new in this change</text>

          <line x1="600" y1="712" x2="640" y2="712" stroke="#5B6B7A" stroke-width="1.4" stroke-dasharray="5,4"/>
          <text x="650" y="716" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#5B6B7A">unaffected / out of scope</text>

          <rect x="920" y="704" width="18" height="14" rx="3" fill="#FBF0DD" stroke="#A6690A" stroke-width="1.2" stroke-dasharray="2,2"/>
          <text x="946" y="716" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#5B6B7A">org policy note</text>
        </g>
      </svg>
